<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script th:src="@{/remio_scrypt.js}"></script>

    <style>


        h1{
            align-items: center;
            align-content: center;
            align-self: center;
            justify-content: center;
            display: flex;
        }

        .divzona{
            align-items: center;
            align-content: center;
            align-self: center;
            justify-content: center;
            display: flex;
            border: none;


        }

        .criar{

            background-color: black;
            color: white;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            border: none;

            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;

            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
        }

        .criar:hover{
            background-color: rgb(65, 65, 65);
        }

        body{
            background-color: rgb(17, 17, 17);
            border: none;
        }


        .main{
            border: none;
        }


        input{
            background-color: rgb(17, 17, 17);
            border: none;
            outline: none;
            color: white;
            width: 100px;
            height: 100px;
        }

        .nome{
            background-color: #3d3d3d;
            color: rgb(255, 255, 255);
            border-radius: 10px;
            width: 86%;
            height: 70px;
            font-size: 16px;
            outline: none;
            display: flex;
        }

        .email{

            background-color: #3d3d3d;
            color: rgb(255, 255, 255);
            border-radius: 10px;
            width: 86%;
            /* width: 50%;
            max-width: 60000px; */
            height: 70px;
            font-size: 16px;
            outline: none;
            display: flex;


        }

        .senha{

            background-color: #3d3d3d;
            color: rgb(255, 255, 255);
            border-radius: 10px;
            width: 86%;
            /* width: 50%;
            max-width: 60000px; */
            height: 70px;
            font-size: 16px;
            outline: none;
            display: flex;


        }

        .campos-cadastro{


            margin-top: 40px;
            margin-left: -30px;
            margin-top: 250px;

        }

        .campos-cadastro input{
            margin: 40px;
        }

        .campos-cadastro p{
            color: white;

        }

        .cadastrar{
            background-color: rgb(199, 4, 199);
            color: rgb(255, 255, 255);
            border-radius: 10px;
            align-items: center;
            width: 87.4%;


            height: 70px;
            font-size: 16px;
            outline: none;

            margin: 4px;
            margin-left: 40px;

        }

        .cadastrar :hover{
            background-color: #03ad83;

        }

        .texto-cadastro{
            position: absolute;
            color: white;
            height: 20px;
            margin-top: -120px;
            margin-left: 11%;
            position: fixed;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }




        .input-lembrete{
            background-color: rgb(17, 17, 17);
            border: none;
            outline: none;
            color: white;
            width: 100px;
            height: 100px;
        }


        .geralCaixa{
            background-color: #171717;
        }

        .link-container {
            display: flex;
            justify-content: space-between;
            width: 87%;
            margin-left: 40px;
            margin-top: 10px;
        }

        .link-container a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }




    </style>
</head>
<body>
<form method="post" action="/login" id="loginForm">
    <div class="container-principal">
        <h1>  </h1>

        <div class="campos-cadastro">
            <h1 class="texto-cadastro">Entrar</h1>
            <input type="text" class="email" placeholder="Email" id="username" name="username">
            <input type="password" class="senha" placeholder="Senha" id="password" name="password">
            <button type="submit" class="cadastrar"> Entrar </button>

            <div class="link-container">
                <a class="cadastrarLink" href="http://localhost:8088/register-view">Cadastrar</a>
                <a class="esqueciSenha" onclick="recoverPassword()">Esqueci minha senha</a>
            </div>
        </div>
    </div>
</form>

<script>
    const form = document.getElementById('loginForm');

    form.addEventListener('submit', () => {
    const username = document.getElementById('username').value;
    localStorage.setItem('username', username);
  });
</script>
</body>
</html>
