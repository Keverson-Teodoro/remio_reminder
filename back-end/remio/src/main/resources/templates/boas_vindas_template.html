<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo(a)</title>
</head>
<body style="margin:0; padding:0; background-color:#000000; width:100%; height:100%;">

    <table role="presentation" width="100%" height="100%" cellpadding="0" cellspacing="0" border="0"
        style="border-collapse:collapse; background-color:#000000; width:100%; height:100%;">
        <tr>
            <td align="center" valign="top" style="position:relative;">

                <table width="100%" cellpadding="0" cellspacing="0" border="0"
                       style="border-collapse:collapse; width:100%; margin-top:30px;">
                    <tr>
                        <td align="left" style="padding-left:40px;">
                            <img src="/static/imagens/remio_logo_com_fundo-removebg-preview.png" alt="Remio" width="130"
                                 style="display:block;">
                        </td>
                        <td align="right" style="padding-right:40px;">
                            <img src="/static/imagens/bolinha_cortada-removebg-preview.png" alt="Círculo decorativo" width="60"
                                 style="display:block;">
                            <img src="/static/imagens/bolinha_sem_corte-removebg-preview.png" alt="Círculo decorativo" width="40"
                                 style="display:block; margin-top:10px;">
                        </td>
                    </tr>
                </table>

                <table cellpadding="0" cellspacing="0" border="0"
                       style="margin-top:120px; text-align:center;">
                    <tr>
                        <td align="center">
                            <h2 style="font-family: Arial, Helvetica, sans-serif; 
                                       font-size:22px; 
                                       color:#ffffff; 
                                       line-height:1.5; 
                                       margin:0;">
                                Olá <span style="font-weight:bold;">${nome}</span>, seja bem-vindo(a) ao<br>
                                Remio, seu app de lembretes.
                            </h2>
                        </td>
                    </tr>
                </table>

                <!-- Ilustração -->
                <table cellpadding="0" cellspacing="0" border="0" style="margin-top:60px;">
                    <tr>
                        <td align="center">
                            <img src="/static/imagens/mulher_com_lapis-sem_fundo.png" alt="Ilustração" width="250"
                                 style="display:block;">
                        </td>
                    </tr>
                </table>

                <table width="100%" cellpadding="0" cellspacing="0" border="0"
                       style="border-collapse:collapse; background-color:#5e17eb; height:100px; margin-top:60px;">
                    <tr>
                        <td>&nbsp;</td>
                    </tr>
                </table>

            </td>
        </tr>
    </table>

</body>
</html>
